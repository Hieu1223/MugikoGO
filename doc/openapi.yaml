openapi: 3.0.3
info:
  title: MugikoGO API
  version: 1.0.0
  description: |
    MugikoGO - Japanese Language Learning Platform API
    
    ## Authentication
    
    The API uses Bearer token authentication with three token types:
    
    | Token Prefix | Type | Description |
    |-------------|------|-------------|
    | `user-<firebase_token>` | Firebase User | Authenticated user via Firebase Auth |
    | `admin-<admin_token>` | Admin | Administrative access |
    | `anonymous-<token>` | Anonymous | Auto-generated anonymous session |
    
    ### Token Format
    ```
    Authorization: Bearer user-<firebase_id_token>
    Authorization: Bearer admin-<admin_token>
    Authorization: Bearer anonymous-<anonymous_token>
    ```
    
    ### No Token Provided
    If no `Authorization` header is provided, the server automatically creates a new anonymous user and returns the token in the `Authorization` response header.
servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.mugiko.example.com
    description: Production server
tags:
  - name: Health
    description: Health check endpoints
  - name: User
    description: User registration and profile management
  - name: Admin
    description: Administrative user management (requires admin role)
  - name: Lookup
    description: Japanese dictionary lookup (public endpoints)
  - name: Deck
    description: Flashcard deck and word management
  - name: Manga
    description: Manga providers, subscriptions, history, and settings
  - name: Subtitle
    description: Subtitle providers, search, segments, and user state
  - name: WebNovel
    description: Web novel management, search, and chapter reading
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use one of the following token formats:
        - `user-<firebase_id_token>` for authenticated users
        - `admin-<admin_token>` for admin access
        - `anonymous-<token>` for anonymous sessions
  schemas:
    # Common schemas
    Error:
      type: object
      properties:
        detail:
          type: string
          example: "Invalid token"
    
    # User/Auth schemas
    AuthType:
      type: string
      enum: [firebase, admin, anonymous]
    
    Role:
      type: string
      enum: [anonymous, user, admin]
    
    RegisterRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: "John Doe"
        bio:
          type: string
          maxLength: 500
          example: "Learning Japanese"
        email:
          type: string
          format: email
          example: "john@example.com"
    
    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [anonymous, user, admin]
        token:
          type: string
          example: "user-eyJhbGciOiJSUzI1NiIs..."
    
    UserProfileResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        bio:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [anonymous, user, admin]
        joined_at:
          type: string
          format: date-time
    
    UserProfileUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        bio:
          type: string
          maxLength: 500
        email:
          type: string
          format: email
    
    UpdateRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [anonymous, user, admin]
    
    UserListResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        bio:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [anonymous, user, admin]
        joined_at:
          type: string
          format: date-time
        is_active:
          type: boolean
    
    UserDetailResponse:
      allOf:
        - $ref: '#/components/schemas/UserListResponse'
        - type: object
          properties:
            auth_type:
              type: string
              enum: [firebase, admin, anonymous]
            auth_id:
              type: string
    
    # Deck schemas
    Deck:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    DeckCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    
    DeckUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    
    DeckResponse:
      allOf:
        - $ref: '#/components/schemas/Deck'
    
    DeckWord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deck_id:
          type: string
          format: uuid
        word:
          type: string
        meaning:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    DeckWordCreateRequest:
      type: object
      required: [word, meaning]
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 255
        meaning:
          type: string
          minLength: 1
    
    DeckWordUpdateRequest:
      type: object
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 255
        meaning:
          type: string
          minLength: 1
    
    DeckWordResponse:
      allOf:
        - $ref: '#/components/schemas/DeckWord'
    
    PaginatedDecksResponse:
      type: object
      properties:
        decks:
          type: array
          items:
            $ref: '#/components/schemas/DeckResponse'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    
    PaginatedDeckWordsResponse:
      type: object
      properties:
        words:
          type: array
          items:
            $ref: '#/components/schemas/DeckWordResponse'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    
    # Lookup schemas
    DictionaryEntry:
      type: object
      properties:
        word:
          type: string
        readings:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryReading'
    
    DictionaryReading:
      type: object
      properties:
        kana:
          type: string
        meaning:
          type: string
    
    KanjiEntry:
      type: object
      properties:
        kanji:
          type: string
        reading:
          type: string
        meanings:
          type: string
        strokes:
          type: integer
        radical:
          type: string
        penstrokes:
          type: string
        shape:
          type: string
        unicode:
          type: string
    
    PrefixSearchResult:
      type: object
      properties:
        words:
          type: array
          items:
            type: string
    
    PrefixSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: string
        limit:
          type: integer
    
    WordLookupRequest:
      type: object
      required: [word]
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 100
    
    PrefixSearchRequest:
      type: object
      required: [prefix]
      properties:
        prefix:
          type: string
          minLength: 1
          maxLength: 50
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
    
    KanjiLookupRequest:
      type: object
      required: [kanji]
      properties:
        kanji:
          type: string
          minLength: 1
          maxLength: 1
    
    # Manga schemas
    ProviderVisibility:
      type: string
      enum: [public, private]
    
    MangaProviderDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
        visibility:
          $ref: '#/components/schemas/ProviderVisibility'
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    MangaSubscriptionDTO:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/MangaProviderDTO'
        created_at:
          type: string
          format: date-time
    
    MangaHistoryDTO:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        manga_id:
          type: string
        chapter_id:
          type: string
        page_index:
          type: integer
        title:
          type: string
        cover_url:
          type: string
        last_read_at:
          type: string
          format: date-time
        provider:
          $ref: '#/components/schemas/MangaProviderDTO'
    
    MangaUserSettingsDTO:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        schema_version:
          type: integer
        data:
          type: object
        updated_at:
          type: string
          format: date-time
    
    BuiltinProviderInfo:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        api_version:
          type: string
    
    BuiltinTagResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        category:
          type: string
    
    BuiltinTagListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinTagResponse'
    
    BuiltinChapterSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        published_at:
          type: string
          format: date-time
    
    BuiltinMangaSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        alternative_titles:
          type: array
          items:
            type: string
        cover_url:
          type: string
        thumbnail_url:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinTagResponse'
        score:
          type: number
        views:
          type: integer
        latest_chapters:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinChapterSummary'
        updated_at:
          type: string
          format: date-time
    
    BuiltinMangaListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinMangaSummary'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    
    BuiltinMangaDetail:
      allOf:
        - $ref: '#/components/schemas/BuiltinMangaSummary'
        - type: object
          properties:
            description:
              type: string
            source_url:
              type: string
            created_at:
              type: string
              format: date-time
    
    BuiltinChapterDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        manga_id:
          type: string
          format: uuid
        number:
          type: string
        title:
          type: string
        published_at:
          type: string
          format: date-time
        pages:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinPageResponse'
    
    BuiltinChapterListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinChapterSummary'
    
    BuiltinPageResponse:
      type: object
      properties:
        index:
          type: integer
        width:
          type: integer
        height:
          type: integer
        urls:
          type: array
          items:
            type: string
    
    BuiltinPageListResponse:
      type: object
      properties:
        width:
          type: integer
        height:
          type: integer
        pages:
          type: array
          items:
            $ref: '#/components/schemas/BuiltinPageResponse'
    
    CreateProviderRequest:
      type: object
      required: [name, base_url]
      properties:
        name:
          type: string
        base_url:
          type: string
        visibility:
          $ref: '#/components/schemas/ProviderVisibility'
    
    UpdateProviderRequest:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        visibility:
          $ref: '#/components/schemas/ProviderVisibility'
    
    SubscribeRequest:
      type: object
      required: [provider_id]
      properties:
        provider_id:
          type: string
          format: uuid
    
    UpsertHistoryRequest:
      type: object
      required: [provider_id, manga_id, chapter_id, title]
      properties:
        provider_id:
          type: string
          format: uuid
        manga_id:
          type: string
        chapter_id:
          type: string
        page_index:
          type: integer
        title:
          type: string
        cover_url:
          type: string
    
    UpdateSettingsRequest:
      type: object
      properties:
        schema_version:
          type: integer
        data:
          type: object
    
    # Subtitle schemas
    ProviderKind:
      type: string
      enum: [remote, youtube]
    
    SubtitleProviderCreate:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: string
    
    SubtitleProviderServiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        service_key:
          type: string
        name:
          type: string
        options:
          type: object
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    SubtitleProviderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: string
        is_active:
          type: boolean
        last_synced_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleProviderServiceResponse'
    
    SubtitleCreate:
      type: object
      required: [video_url, provider_id, service_key]
      properties:
        video_url:
          type: string
        provider_id:
          type: string
          format: uuid
        service_key:
          type: string
    
    SubtitleSegmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        subtitle_id:
          type: string
          format: uuid
        idx:
          type: integer
        start_ms:
          type: integer
        end_ms:
          type: integer
        words:
          type: object
    
    SubtitleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
        video_url:
          type: string
        provider_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    SubtitleSegmentsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleSegmentResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    
    SubtitleListResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
        video_url:
          type: string
        provider_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        segment_count:
          type: integer
    
    UserSettingsResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        schema_version:
          type: integer
        data:
          type: object
        updated_at:
          type: string
          format: date-time
    
    UserSettingsUpdate:
      type: object
      required: [schema_version, data]
      properties:
        schema_version:
          type: integer
        data:
          type: object
    
    SubtitleUserStateResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        subtitle_id:
          type: string
          format: uuid
        schema_version:
          type: integer
        data:
          type: object
        updated_at:
          type: string
          format: date-time
    
    SubtitleUserStateUpdate:
      type: object
      required: [schema_version, data]
      properties:
        schema_version:
          type: integer
        data:
          type: object
    
    SubtitleHistoryResponse:
      type: object
      properties:
        subtitle_id:
          type: string
          format: uuid
        video_id:
          type: string
        video_url:
          type: string
        last_accessed_at:
          type: string
          format: date-time
        segment_count:
          type: integer
    
    SubtitleHistoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleHistoryResponse'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    
    # WebNovel schemas
    SourceEnum:
      type: string
      enum: [syosetsu]
    
    NovelDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceEnum'
        source_id:
          type: string
        url:
          type: string
        title:
          type: string
        author:
          type: string
        synopsis:
          type: string
        added_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    
    ChapterDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        novel_id:
          type: string
          format: uuid
        idx:
          type: integer
        title:
          type: string
        created_at:
          type: string
          format: date-time
    
    ParagraphDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        chapter_id:
          type: string
          format: uuid
        idx:
          type: integer
        text:
          type: string
        words:
          type: array
          items:
            type: string
    
    PreviewRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    
    PreviewResponse:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        author:
          type: string
        synopsis:
          type: string
        source:
          $ref: '#/components/schemas/SourceEnum'
    
    AddNovelRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
    
    AddNovelResponse:
      type: object
      properties:
        novel:
          $ref: '#/components/schemas/NovelDTO'
        job_id:
          type: string
    
    PaginatedNovelsResponse:
      type: object
      properties:
        novels:
          type: array
          items:
            $ref: '#/components/schemas/NovelDTO'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
    
    NovelWithChaptersResponse:
      allOf:
        - $ref: '#/components/schemas/NovelDTO'
        - type: object
          properties:
            chapters:
              type: array
              items:
                $ref: '#/components/schemas/ChapterDTO'
    
    ChapterResponse:
      allOf:
        - $ref: '#/components/schemas/ChapterDTO'
        - type: object
          properties:
            paragraphs:
              type: array
              items:
                $ref: '#/components/schemas/ParagraphDTO'
    
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          type: integer
    
    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NovelDTO'
        total:
          type: integer
    
    SyncRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false

security:
  - BearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check endpoint
      description: Public endpoint - no authentication required
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  
  # ==================== USER ROUTES ====================
  /api/v1/users/register:
    post:
      tags: [User]
      summary: Register a new user
      description: |
        Register a new user using a Firebase ID token.
        The token should be sent as `Authorization: Bearer user-<firebase_id_token>`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          headers:
            Authorization:
              description: Bearer token for the new user
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid Firebase token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /api/v1/users/me:
    get:
      tags: [User]
      summary: Get current user profile
      description: Requires authentication (any valid token)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
    patch:
      tags: [User]
      summary: Update current user profile
      description: Requires authentication (any valid token)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  # ==================== ADMIN ROUTES ====================
  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List all users
      description: Requires admin role
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of users
          content:
